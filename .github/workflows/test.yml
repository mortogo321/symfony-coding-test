name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: symfony
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: amqp, pdo_mysql, zip
          coverage: none

      - name: Validate composer config
        run: composer validate --no-check-publish

      - name: Lint PHP syntax
        run: |
          find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

  test:
    name: Test
    runs-on: ubuntu-24.04

    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: app_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      rabbitmq:
        image: rabbitmq:4.3-management
        ports:
          - 5672:5672

    defaults:
      run:
        working-directory: symfony

    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        run: |
          cp .env.ci .env
          cp .env.ci .env.test.local

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: amqp, pdo_mysql, zip
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('symfony/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run migrations
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:migrations:migrate --no-interaction

      - name: Run tests
        run: php bin/phpunit

  docker:
    name: Docker build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate compose configs
        env:
          APP_SECRET: ci_dummy_secret_for_validation_only
        run: |
          docker compose -f docker/docker-compose.yml config --quiet
          docker compose -f docker/docker-compose.prod.yml config --quiet

      - name: Build dev target
        run: docker build -f symfony/Dockerfile --target dev -t symfony-coding-test:dev .

      - name: Build prod target
        run: docker build -f symfony/Dockerfile --target prod -t symfony-coding-test:prod .
